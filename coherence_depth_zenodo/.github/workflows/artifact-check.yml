name: Artifact check

on:
  push:
    branches:
      - main
    tags:
      - "v*-lmcs-artifact"
  pull_request:
  workflow_dispatch:

jobs:
  artifact-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out artifact
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Haskell toolchain
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.8.4"
          cabal-version: "3.12.1.0"

      - name: Cache Agda installation
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/bin
            ~/.cabal/store
          key: ${{ runner.os }}-agda-2.8.0-${{ hashFiles('.github/workflows/artifact-check.yml') }}
          restore-keys: |
            ${{ runner.os }}-agda-2.8.0-

      - name: Install Agda 2.8.0
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cabal/bin:$PATH"
          echo "$HOME/.cabal/bin" >> "$GITHUB_PATH"
          if ! command -v agda >/dev/null 2>&1 || ! agda --version | grep -q "2.8.0"; then
            cabal update
            cabal install Agda-2.8.0 --overwrite-policy=always
          fi
          agda --version

      - name: Pin Cubical library
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/agda/cubical.git "$HOME/cubical"
          git -C "$HOME/cubical" checkout b150186d2544e7efeddd31e5d14a8b9ecbb100f7
          cp "$HOME/cubical/cubical.agda-lib" "$HOME/cubical/cubical-0.9.agda-lib"
          sed -i 's/^name:.*/name: cubical/' "$HOME/cubical/cubical.agda-lib"
          sed -i 's/^name:.*/name: cubical-0.9/' "$HOME/cubical/cubical-0.9.agda-lib"
          mkdir -p "$HOME/.agda"
          {
            echo "$GITHUB_WORKSPACE/coherence-depth.agda-lib"
            echo "$GITHUB_WORKSPACE/agda/pen.agda-lib"
            echo "$HOME/cubical/cubical.agda-lib"
            echo "$HOME/cubical/cubical-0.9.agda-lib"
          } > "$HOME/.agda/libraries"
          {
            echo "coherence-depth"
            echo "pen"
            echo "cubical"
            echo "cubical-0.9"
          } > "$HOME/.agda/defaults"

      - name: Run artifact and semantic checks
        shell: bash
        run: bash scripts/check_coherence_depth_artifact.sh
